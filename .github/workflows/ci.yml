name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3@13 requiere Node-API 10 (≥22.14); en Node 20 pega SIGSEGV
          node-version: "22.14"
          cache: npm
      - run: npm ci
      - run: npm test
